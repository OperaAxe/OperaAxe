<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics card is being generated</title>
  <desc id="desc">A local placeholder that will be replaced by the GitHub Actions stats workflow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#252447"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
  <rect x="1" y="1" width="493" height="178" rx="14" fill="url(#bg)" stroke="#45436d"/>
  <rect x="24" y="25" width="5" height="130" rx="2.5" fill="url(#accent)"/>
  <text x="47" y="52" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">GITHUB STATISTICS</text>
  <text x="47" y="91" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Your stats card is being generated</text>
  <text x="47" y="119" fill="#a5b4fc" font-family="Segoe UI,Arial,sans-serif" font-size="13">This local image will be replaced by the next</text>
  <text x="47" y="139" fill="#a5b4fc" font-family="Segoe UI,Arial,sans-serif" font-size="13">successful GitHub Actions update.</text>
  <circle cx="450" cy="42" r="8" fill="#2dd4bf"/><circle cx="470" cy="42" r="8" fill="#60a5fa"/>
</svg>